<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strava → Peakbagger</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Strava → Peakbagger</h1>
        <div class="header-actions">
          <label class="show-hidden-toggle">
            <input id="show-hidden" type="checkbox" />
            Show hidden
          </label>
          <button id="hide-all-btn" type="button" class="secondary">Hide all</button>
          <button id="refresh-btn" type="button">Find next match</button>
        </div>
      </header>

      <p id="cid-warning" class="warning" role="status" hidden>
        Set your peakbagger climber ID on the Options page before opening
        any activity.
      </p>

      <p id="status" role="status" aria-live="polite"></p>
      <p id="match-progress" role="status" aria-live="polite"></p>

      <ul id="activity-list" aria-label="Recent activities"></ul>

      <p id="empty-state" class="empty" hidden>
        No activities. Click Find next match to fetch from Strava.
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
